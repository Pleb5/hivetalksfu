log_format hivetalk_noargs '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name calls.budabit.club;
    access_log /var/log/nginx/calls.budabit.club.access.log hivetalk_noargs;

    location / {
        return 503;
    }
}
