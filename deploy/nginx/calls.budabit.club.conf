log_format hivetalk_noargs '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                            '$status $body_bytes_sent "$http_user_agent"';

limit_conn_zone $binary_remote_addr zone=hivetalk_connections:10m;
limit_req_zone $binary_remote_addr zone=hivetalk_requests:10m rate=20r/s;

map $uri $hivetalk_frame_ancestors {
    default "'self' https://budabit.club https://*.budabit.club http://localhost:* http://127.0.0.1:*";
    ~^/join(?:/|$) "*";
}

server {
    listen 80;
    listen [::]:80;
    server_name calls.budabit.club;
    access_log /var/log/nginx/calls.budabit.club.access.log hivetalk_noargs;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name calls.budabit.club;

    ssl_certificate /etc/letsencrypt/live/calls.budabit.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calls.budabit.club/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/calls.budabit.club.access.log hivetalk_noargs;
    error_log /var/log/nginx/calls.budabit.club.error.log;

    client_max_body_size 2m;
    limit_conn hivetalk_connections 50;
    limit_req zone=hivetalk_requests burst=100 nodelay;

    add_header Content-Security-Policy "frame-ancestors $hivetalk_frame_ancestors" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), fullscreen=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location ~ ^/(active|newroom|support|donate|presskit|rtmp|zapgoal)(/|$) {
        return 404;
    }

    location ~ ^/api/(v1|zbd|zapgoal)(/|$) {
        return 404;
    }

    location ^~ /.well-known/ {
        return 404;
    }

    location ^~ /views/ {
        return 404;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
        proxy_hide_header X-Frame-Options;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_hide_header X-Frame-Options;
    }
}
